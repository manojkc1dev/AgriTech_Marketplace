version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: agritech_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agritech_db}
      POSTGRES_USER: ${POSTGRES_USER:-agritech_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agritech_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agritech_user} -d ${POSTGRES_DB:-agritech_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: